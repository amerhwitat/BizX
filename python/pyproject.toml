[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bizx"
version = "1.0.0"
description = "Python implementation of BizX business services and integrations"
requires-python = ">=3.10"

[project.scripts]
bizx = "bizx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bizx*"]
