name: BizX retro media validation
on:
  push:
    branches: [main]
    paths: ['retro/**','.github/workflows/retro-media-validation.yml']
  pull_request:
    paths: ['retro/**','.github/workflows/retro-media-validation.yml']
  workflow_dispatch:
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 retro/scripts/validate_cbm_media.py
      - run: python3 -m json.tool retro/retro-manifest.json >/dev/null
  c64-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y vice
      - name: Bounded C64 startup
        timeout-minutes: 2
        run: |
          x64sc -console -autostart retro/media/cbm/BizX-C64.d64 >/tmp/bizx-c64.log 2>&1 &
          pid=$!
          sleep 15
          kill "$pid" 2>/dev/null || true
          test -f retro/media/cbm/BizX-C64.d64
          cat /tmp/bizx-c64.log || true
