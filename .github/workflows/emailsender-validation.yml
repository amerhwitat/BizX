name: Validate EmailSender
on:
  push:
    paths:
      - 'emailsender/**'
      - '.github/workflows/emailsender-validation.yml'
  pull_request:
    paths:
      - 'emailsender/**'
      - '.github/workflows/emailsender-validation.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test emailsender/nodejs/test/*.test.js
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile emailsender/python/emailsender/__init__.py
