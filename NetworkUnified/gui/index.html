<!doctype html><html><head><meta charset="utf-8"><title>BizX Network API</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem}pre{background:#111;color:#eee;padding:1rem;overflow:auto}button{padding:.6rem 1rem;margin:.2rem}</style></head><body><h1>BizX Network API</h1><p>Local user-facing API console. Default endpoint: <code>http://127.0.0.1:8787/api/v1</code></p><button onclick="load('/api/v1')">API catalog</button><button onclick="load('/api/v1/health')">Health</button><button onclick="load('/api/v1/config')">Config</button><button onclick="load('/api/v1/interfaces')">Interfaces</button><pre id="out">Ready.</pre><script>async function load(p){try{let r=await fetch('http://127.0.0.1:8787'+p);document.querySelector('#out').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.querySelector('#out').textContent='API unavailable: '+e.message}}</script></body></html>
