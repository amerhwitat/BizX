<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InternetScanner Security Explorer</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>InternetScanner</h1><span>Authorized Network Inventory & Security Explorer</span></header><main><section class="controls"><label>Targets <input id="targets" placeholder="127.0.0.1, 192.168.1.1"></label><label>Ports <input id="ports" value="22,53,80,443"></label><label><input id="tcp" type="checkbox" checked> TCP</label><label><input id="udp" type="checkbox" checked> UDP</label><button id="start">Start scan</button><button id="stop">Cancel</button><button id="export">Export JSON</button><input id="import" type="file" accept="application/json"></section><section class="grid"><article><h2>Hosts</h2><table><thead><tr><th>IP</th><th>Scope</th><th>State</th><th>Ports</th></tr></thead><tbody id="hosts"></tbody></table></article><article><h2>Topology</h2><div id="map" class="map"></div></article><article><h2>Live events</h2><pre id="events"></pre></article></section></main><script type="module" src="/main.js"></script></body></html>
